<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>旅行控制中心（鱷魚版）</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#d6457a"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="旅行控制中心">
<style>
:root{--ac:#d6457a;--acd:#ff8fb3;--g1:#ff8fb3;--g2:#c77dff;--acx:#fff;--tx:#3a2530;--sub:#8a6f7b;--bad:#c0392b;--bg:color-mix(in srgb,var(--ac) 7%,#fff);--card:#fff;--bd:color-mix(in srgb,var(--ac) 22%,#fff);--soft:color-mix(in srgb,var(--ac) 12%,#fff);--ok:#2f9e5b;color-scheme:light}
html[data-ac=maple]{--ac:#c8481c;--acd:#ff9a5c;--g1:#ff8a3d;--g2:#d6336c}
html[data-ac=sea]{--ac:#1c7ed6;--acd:#74c0fc;--g1:#4dabf7;--g2:#20c997}
html[data-ac=classic]{--ac:#0f7b6c;--acd:#3fb8a5;--g1:#0f7b6c;--g2:#2f5d8a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ac:var(--acd);--acx:#220e17;--tx:#f6e9ee;--sub:#c4a3b2;--bad:#ff7b6b;--ok:#6fd49b;--bg:color-mix(in srgb,var(--acd) 8%,#171214);--card:color-mix(in srgb,var(--acd) 10%,#211a1d);--bd:color-mix(in srgb,var(--acd) 28%,#211a1d);--soft:color-mix(in srgb,var(--acd) 18%,#211a1d);color-scheme:dark}}
:root[data-theme="dark"]{--ac:var(--acd);--acx:#220e17;--tx:#f6e9ee;--sub:#c4a3b2;--bad:#ff7b6b;--ok:#6fd49b;--bg:color-mix(in srgb,var(--acd) 8%,#171214);--card:color-mix(in srgb,var(--acd) 10%,#211a1d);--bd:color-mix(in srgb,var(--acd) 28%,#211a1d);--soft:color-mix(in srgb,var(--acd) 18%,#211a1d);color-scheme:dark}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:linear-gradient(180deg,var(--soft),transparent 260px) no-repeat,var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
body.mo{overflow:hidden}
main{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:20px;margin:2px 0 12px;color:var(--ac);overflow-wrap:anywhere}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 3px 10px color-mix(in srgb,var(--ac) 10%,transparent);min-width:0}
label{display:block;font-size:13px;color:var(--sub);margin:8px 0 3px}
input,select,textarea{width:100%;min-width:0;padding:10px;min-height:44px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;height:44px;max-width:100%}
input[type=file]{padding:8px;font-size:14px}
.row{display:flex;gap:8px}.row>div{flex:1;min-width:0}
.btn{width:100%;margin-top:12px;padding:12px;min-height:46px;border:0;border-radius:10px;background:var(--ac);color:var(--acx);font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.btn.dg{background:var(--bad);color:#fff}
.btn.sm{width:auto;margin:0;padding:6px 12px;min-height:36px;font-size:14px}
.bt{background:none;border:0;color:var(--ac);font-size:13px;padding:8px 6px;min-height:36px;cursor:pointer}
.bt.d{color:var(--bad)}
.big{font-size:28px;font-weight:700;color:var(--ac)}
.sub{color:var(--sub);font-size:13px}
.warn{color:var(--bad)}
.hide{display:none!important}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--ac)}
.bar.over i{background:var(--bad)}
.item{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}.item>div:first-child{min-width:0;flex:1;overflow-wrap:anywhere}
.item b{display:block}
.amt{text-align:right;flex:none;max-width:44%;overflow-wrap:anywhere}
.l{display:flex;justify-content:space-between;gap:8px;font-size:14px}.l>span:first-child,.l>b{min-width:0;overflow-wrap:anywhere}
.chk{display:flex;gap:8px;align-items:flex-start;margin:0;color:var(--tx);font-size:16px}
.chk input{margin-top:6px;width:20px;height:20px;flex:none}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--ac);margin:2px 4px 0 0;white-space:nowrap}
.tag.g{background:#e6f6ec;color:#1f7a45}.tag.r{background:#fde8e8;color:#b02a2a}.tag.y{background:#fff4d6;color:#8a6100}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;padding:8px 4px;min-height:40px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:14px;cursor:pointer}.seg button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.stp{display:flex;align-items:center;gap:8px}.stp button{width:46px;height:46px;border-radius:10px;border:1px solid var(--ac);background:transparent;color:var(--ac);font-size:22px;cursor:pointer;flex:none}.stp input{text-align:center;flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.tile{min-width:0}.tile img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;background:var(--bd)}
#zm{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:70;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}#zm img{max-width:100%;max-height:100%;object-fit:contain}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--bd);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
#nav>div{display:flex;width:100%;max-width:560px;gap:2px}
#nav button{flex:1;min-width:0;min-height:52px;border:0;background:none;color:var(--sub);font:inherit;font-size:11px;line-height:1.25;border-radius:10px;cursor:pointer;padding:4px 0}
#nav button span{display:block;font-size:20px;line-height:1.1}
#nav button.on{color:var(--ac);background:var(--soft);font-weight:700}
#md{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--tx);width:100%;max-width:560px;max-height:90vh;max-height:90dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px;font-size:17px}
.sh-h .x{background:none;border:0;color:var(--sub);font-size:20px;min-width:44px;min-height:44px;cursor:pointer}
.sh-b{padding:0 16px 8px;overflow-y:auto;overflow-x:hidden;flex:1;-webkit-overflow-scrolling:touch}
.sh-f{display:flex;gap:8px;padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd)}.sh-f .btn{margin:0}
#ts{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:65;max-width:536px;margin:0 auto;background:#2b2b2e;color:#fff;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
#ts button{background:none;border:0;color:#ffb3cd;font:inherit;font-weight:700;min-height:36px;padding:0 6px;cursor:pointer}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-bottom:8px}
.mgrid button{min-height:76px;border:1px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);font:inherit;font-size:14px;cursor:pointer;padding:6px 2px}.mgrid button span{display:block;font-size:26px}
.daybar{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff;padding:10px 12px;border-radius:12px;margin-bottom:4px;cursor:pointer}
.daybar>b{min-width:0;overflow-wrap:anywhere}
.stamp{display:inline-block;border:2px solid #d6334a;color:#d6334a;border-radius:50%;width:26px;height:26px;line-height:22px;text-align:center;font-size:13px;font-weight:700;transform:rotate(-12deg);margin-left:6px}
.pv img{width:100%;display:block;border-radius:12px}
a{color:var(--ac)}
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--bd);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;text-align:center}
.top h1{margin:0;font-size:17px;color:var(--ac);overflow-wrap:anywhere}
/* V2.1 */
.top{display:flex;align-items:center;gap:8px;text-align:left}.top h1{flex:1;min-width:0;text-align:center}
.net{display:inline-block;font-size:11px;padding:4px 8px;border-radius:99px;background:var(--soft);color:var(--sub);white-space:nowrap}.net.off{background:#fde8e8;color:#b02a2a}.net.on{color:#1f7a45}
.tdy{flex:none;border:0;border-radius:99px;background:var(--ac);color:var(--acx);font:inherit;font-size:13px;font-weight:700;padding:8px 12px;min-height:36px}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.q{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;min-height:64px;font:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px}
.q span{font-size:22px;line-height:1}.q.pri{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
.catbar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:10px 0 2px;padding:6px 10px;border-radius:10px;background:var(--soft);font-size:14px}.catbar b{min-width:0;overflow-wrap:anywhere}
.daytot{display:flex;justify-content:space-between;gap:8px;margin-top:10px;padding-top:8px;border-top:2px solid var(--bd);font-size:16px}
.ov{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:14px}
.tph{aspect-ratio:1;border-radius:10px;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:24px}
.addph{display:inline-block;margin-top:6px;color:var(--ac);cursor:pointer;min-height:36px;line-height:36px}
.pk{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 4px;border-bottom:1px solid var(--bd);cursor:pointer}.pk:last-child{border:0}
.pkb{flex:none;width:32px;height:32px;border-radius:9px;border:2px solid var(--ac);display:flex;align-items:center;justify-content:center;color:var(--acx);font-weight:700;font-size:20px}
.pk.dn .pkb{background:var(--ac)}.pk.dn .pkt{text-decoration:line-through;opacity:.55}.pkt{flex:1;min-width:0;overflow-wrap:anywhere;font-size:17px}
.chk input{width:26px;height:26px}

.top h1[role=button]{cursor:pointer;-webkit-tap-highlight-color:transparent}

.tile{position:relative}.tdel{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:26px;padding:0;cursor:pointer;margin:0}
.swp{position:relative;overflow:hidden;border-radius:16px;margin-bottom:12px}.swp .card{margin-bottom:0;position:relative;z-index:1;transition:transform .2s}.swp.x{}
.swp-act{position:absolute;left:0;top:0;bottom:0;width:92px;display:flex}.swp-act button{flex:1;margin:0;border:0;border-radius:16px 0 0 16px;background:var(--bad,#d33);color:#fff;font-size:14px;font-weight:700;line-height:1.4}
.swp-in.open{transform:translateX(92px)}

.tpl{display:flex;gap:10px;align-items:flex-start;margin:8px 0 0;padding:10px;border:1px solid var(--bd);border-radius:12px;color:var(--tx);font-size:14px}
.tpl.on{border-color:var(--ac);background:var(--soft)}.tpl input{margin-top:4px;width:18px;height:18px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chip{display:inline-flex;align-items:center;gap:6px;margin:0;padding:8px 12px;border:1px solid var(--bd);border-radius:99px;color:var(--tx);font-size:14px}
.chip input{width:18px;height:18px}


/* ===== 行程頁 Day 卡片（旅行手帳風格）：只作用在 .pday，不影響其他頁的 .daybar ===== */
.pday{position:relative;padding:0;overflow:hidden;box-shadow:0 2px 8px color-mix(in srgb,var(--ac) 7%,transparent)}
.pday:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rg,var(--ac));opacity:.55}
.pday.is-today{background:color-mix(in srgb,var(--ac) 5%,var(--card));border-color:color-mix(in srgb,var(--ac) 45%,var(--bd))}
.pday.is-today:before{background:var(--ac);opacity:1}
.pday-h{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;min-height:64px;-webkit-tap-highlight-color:transparent}
.pday-h[role=button]{cursor:pointer}
.pday-h[role=button]:focus-visible{outline:2px solid var(--ac);outline-offset:-2px;border-radius:16px}
.pday-char:empty{display:none}
.pday-main{flex:1;min-width:0}
.pday-top{display:flex;align-items:baseline;gap:8px;white-space:nowrap;min-width:0}
.pday-no{flex:none;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--ac)}
.pday-date{font-size:17px;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis}
.pday-today{flex:none;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--ac);color:var(--acx)}
.pday-meta{display:flex;align-items:center;gap:8px;margin-top:3px;min-width:0}
.pday-loc{flex:1;min-width:0;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pday-pill{flex:none;font-size:12px;font-weight:700;line-height:1.5;padding:1px 9px;border-radius:99px;white-space:nowrap;background:color-mix(in srgb,var(--sub) 13%,transparent);color:var(--sub)}
.pday-pill.st-part{background:var(--soft);color:var(--ac)}
.pday-pill.st-ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pday-pill.st-none{font-weight:400}
.pday-chev{flex:none;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--sub);font-size:22px;line-height:1;transition:transform .2s}
.pday.is-open .pday-chev{transform:rotate(90deg);color:var(--ac)}
.pday-body{padding:2px 14px 8px 16px;border-top:1px dashed var(--bd)}
/* 展開後：時間軸（只是視覺，列內容與操作完全不變） */
.pday-body>.item{position:relative;padding-left:22px;border-bottom:0}
.pday-body>.item:before{content:"";position:absolute;left:2px;top:16px;width:8px;height:8px;border-radius:50%;background:var(--card);border:2px solid var(--ac);z-index:1}
.pday-body>.item:after{content:"";position:absolute;left:7px;top:28px;bottom:-16px;width:2px;background:var(--bd)}
.pday-body>.item:last-child:after{display:none}
.pday-body>.item:has(input:checked):before{background:var(--ac)}
.pday-body>.item.evt:before{border-radius:3px;border-color:var(--sub)}
.pday-tools .btn{border-color:var(--bd);background:var(--card)}

/* 日期標題列：沒有指定地區底色的（明細、交通、預約、票券中心按日期）用淡粉底深色字，避免白字配透明底看不見 */
.daybar:not([style*="background"]){background:var(--soft);color:var(--tx);padding:8px 12px;margin-bottom:6px}
.daybar:not([style*="background"])>b{color:var(--ac);overflow-wrap:anywhere}
.daybar:not([style*="background"])>span{flex:none;font-size:13px;color:var(--sub);white-space:nowrap}

/* ===== 行程：一天一頁＋左右滑動（共用版面；各主題只覆寫外觀） ===== */
.pd-strip{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -14px 10px;padding:4px 14px 8px}
.pd-strip::-webkit-scrollbar{display:none}
.pd-d{flex:none;scroll-snap-align:center;width:56px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer;padding:4px 2px;position:relative;transition:transform .15s,box-shadow .15s,background .15s}
.pd-d b{font-size:14px;line-height:1.25;font-variant-numeric:tabular-nums}
.pd-dw{font-size:11px;color:var(--sub)}
.pd-dn{font-size:10px;color:var(--sub);font-weight:700;letter-spacing:.04em}
.pd-d.on{background:var(--ac);border-color:var(--ac);color:var(--acx);transform:scale(1.08);box-shadow:0 4px 12px color-mix(in srgb,var(--ac) 30%,transparent)}
.pd-d.on .pd-dw,.pd-d.on .pd-dn{color:inherit;opacity:.85}
.pd-d.is-today:not(.on){border-color:var(--ac);border-width:2px}
.pd-wrap{touch-action:pan-y;overflow-x:clip;margin:0 -14px;padding:0 14px}
.pd-page{will-change:transform}
@keyframes pdInR{from{transform:translateX(35%);opacity:0}to{transform:none;opacity:1}}
@keyframes pdInL{from{transform:translateX(-35%);opacity:0}to{transform:none;opacity:1}}
.pd-in-r{animation:pdInR .2s ease-out}.pd-in-l{animation:pdInL .2s ease-out}
@media (prefers-reduced-motion:reduce){.pd-in-r,.pd-in-l{animation:none}.pd-d{transition:none}}
.pd-hero{position:relative;display:flex;align-items:center;gap:12px;padding:16px 14px 14px 18px;overflow:hidden}
.pd-hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--rg,var(--ac))}
.pd-hero.is-today{border-color:var(--ac)}
.pd-art:empty{display:none}
.pd-hero-txt{flex:1;min-width:0}
.pd-no{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--ac)}
.pd-title{font-size:20px;font-weight:800;line-height:1.3;margin-top:2px;overflow-wrap:anywhere}
.pd-key{font-weight:700;color:var(--sub);font-size:15px}
.pd-date{font-size:14px;color:var(--sub);margin-top:2px}
.pd-meta{margin-top:8px}
.pd-arrows{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.pd-arr{width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--sub);font-size:20px;line-height:1;cursor:pointer;padding:0}
.pd-arr:disabled{opacity:.3;cursor:default}
.pd-hero .pd-hero-txt{padding-right:64px}
.pd-hint{text-align:center;font-size:12px;opacity:.7;margin:-4px 0 12px}
@media (hover:hover) and (pointer:fine){.pd-hint{display:none}}

.pvt{margin-top:12px;padding:12px;border:1px dashed var(--bd);border-radius:12px;background:var(--soft)}
</style></head><body>
<header class="top"><span id="net"></span><h1 id="ttl" role="button" onclick="tripPicker()">旅行控制中心</h1><button class="tdy" onclick="goToday()">📍 今天</button></header>

<script>/* 主題包註冊表：角色主題放在 themes/<名稱>/，用 registerTheme() 加進來 */
var THEME_PACKS={};function registerTheme(id,pack){THEME_PACKS[id]=pack}
function themePack(){return (typeof S!=="undefined"&&S&&THEME_PACKS[S.ac])||null}
function themeChar(){var p=themePack();return (p&&p.char)||""}</script>

<script>
var SEED=[];

/* ===== Migration =====  舊資料不刪、缺欄位補預設；未來 V2→V3 在 MIG 陣列加一個函式 */
function parseEnd(lab){var m=/(\d{1,2}:\d{2})\s*[～~–\-]\s*(\d{1,2}:\d{2})/.exec(lab||"");return m?m[2].replace(/^(\d):/,"0$1:"):""}
function normRates(r){var o={},k;r=(r&&typeof r==="object")?r:{};for(k in r){var n=+r[k];if(isFinite(n)&&n>=0)o[k]=n}if(!Object.keys(o).length)o=defState().rates;o.TWD=1;return o}
/* 分攤人員名稱（選填）：舊資料沒有 peopleNames 也安全 */
function cleanNames(a){return (Array.isArray(a)?a:[]).map(function(x){return typeof x==="string"?x.trim().slice(0,20):""}).filter(Boolean).slice(0,99)}
function parseNames(s){return cleanNames(String(s||"").split(/[、,，;；\n]+/))}
function normItem(i,rates){
  i=(i&&typeof i==="object")?i:{};var cur=sStr(i.cur,"TWD")||"TWD";
  var rate=(i.rate===undefined||i.rate===null||i.rate==="")?NaN:+i.rate;
  if(!(rate>0)){rate=(rates&&+rates[cur]>0)?+rates[cur]:(cur==="TWD"?1:0)}
  var pp=Math.floor(sNum(i.people,1));if(!(pp>=1))pp=1;if(pp>99)pp=99;
  return Object.assign({},i,{id:sNum(i.id,mkId()),date:sStr(i.date),cat:sStr(i.cat,"其他"),name:sStr(i.name,"（未命名）"),
    amount:Math.max(0,sNum(i.amount,0)),cur:cur,rate:rate,pay:sStr(i.pay,"現金"),people:pp,peopleNames:(pp>1?cleanNames(i.peopleNames):[]),note:sStr(i.note)})}
function normPlan(p,old){
  p=(p&&typeof p==="object")?p:{};var o=Object.assign({},p);
  o.id=sNum(p.id,mkId());o.date=sStr(p.date);o.time=sStr(p.time);o.lab=sStr(p.lab);o.name=sStr(p.name,"（未命名）");
  o.place=sStr(p.place);o.note=sStr(p.note);o.done=!!p.done;o.skip=!!p.skip;
  o.end=sStr(p.end);if(old&&!o.end&&o.time!=="23:59")o.end=parseEnd(o.lab);
  o.cost=Math.max(0,sNum(p.cost,0));o.costCur=sStr(p.costCur,"JPY")||"JPY";o.trans=sStr(p.trans);o.resv=p.resv?resvSt(p.resv):"";
  var im=Math.floor(sNum(p.imp,NaN));
  if(!(im>=0&&im<=2)){im=(old&&/🔥|🚢|🎭|🌙|🚞|🚲|✈️|火渡祭|神樂|滿願/.test(o.name))?2:0}
  o.imp=im;return o}
function normGosh(g){g=(g&&typeof g==="object")?g:{};return Object.assign({},g,{id:sNum(g.id,mkId()),date:sStr(g.date),name:sStr(g.name,"（未命名）"),place:sStr(g.place),note:sStr(g.note),done:!!g.done})}
function normTrans(t){t=(t&&typeof t==="object")?t:{};var ty=TRANS_LEGACY[t.type]||sStr(t.type,"OTHER");if(!TRANS_TYPES.some(function(x){return x[0]===ty}))ty="OTHER";
  var ts=TICKET_STATUS.indexOf(t.ticketStatus)>=0?t.ticketStatus:(TICKET_LEGACY[t.status]||"尚未購票");
  var dd=sStr(t.date),ad=sStr(t.arrDate)||dd;if(dd&&ad<dd)ad=dd;
  return{id:sNum(t.id,mkId()),type:ty,date:dd,time:sStr(t.time),arrDate:ad,arrTime:sStr(t.arrTime),from:sStr(t.from),to:sStr(t.to),no:sStr(t.no),price:Math.max(0,sNum(t.price,0)),cur:sStr(t.cur,"JPY")||"JPY",ticketStatus:ts,note:sStr(t.note)}}
function normResv(r){r=(r&&typeof r==="object")?r:{};return{id:sNum(r.id,mkId()),name:sStr(r.name,"（未命名）"),date:sStr(r.date),time:sStr(r.time),place:sStr(r.place),type:RESV_TYPES.indexOf(r.type)>=0?r.type:"其他",code:sStr(r.code),amount:Math.max(0,sNum(r.amount,0)),cur:sStr(r.cur,"JPY")||"JPY",status:resvSt(r.status),note:sStr(r.note)+(r.status==="已付款"&&sStr(r.note).indexOf("已付款")<0?(r.note?"　":"")+"（已付款）":"")}}
function normPack(k){k=(k&&typeof k==="object")?k:{};var g=["pre","daily","return"].indexOf(k.group)>=0?k.group:"pre";return{id:sNum(k.id,mkId()),group:g,text:sStr(k.text,"（未命名）"),done:!!k.done}}
function arr(a){return Array.isArray(a)?a:[]}
function uniq(list){var seen={};list.forEach(function(x){while(seen[x.id])x.id=mkId();seen[x.id]=1});return list}
function normBlock(d,old){ // 對 state 或封存旅程做同一套正規化
  var rates=d.rates;
  d.items=uniq(arr(d.items).map(function(i){return normItem(i,rates)}));
  d.plan=uniq(arr(d.plan).map(function(p){return normPlan(p,old)}));
  d.gosh=uniq(arr(d.gosh).map(normGosh));
  d.trans=uniq(arr(d.trans).map(normTrans));
  d.resv=uniq(arr(d.resv).map(normResv));
  d.pack=uniq(arr(d.pack).map(normPack));
  d.dayNotes=normNotes(d.dayNotes);
}
function normNotes(o){var r={};if(o&&typeof o==="object"&&!Array.isArray(o)){for(var k in o){if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&typeof o[k]==="string"&&o[k].trim())r[k]=o[k].slice(0,1000)}}return r}
function normPhoto(p){p=(p&&typeof p==="object")?p:{};return Object.assign({},p,{id:sNum(p.id,mkId()),aid:sStr(p.aid),lid:sStr(p.lid),date:sStr(p.date),cap:sStr(p.cap),place:sStr(p.place),trip:sStr(p.trip,"t1")||"t1",t:sNum(p.t,0)})}
function normFx(m,rates){
  m=(m&&typeof m==="object")?m:{};var r={},mo={},k;
  if(m.rates&&typeof m.rates==="object")for(k in m.rates){var n=+m.rates[k];if(isFinite(n)&&n>0)r[k]=n}
  if(m.manualOverride&&typeof m.manualOverride==="object")for(k in m.manualOverride){var q=+m.manualOverride[k];if(isFinite(q)&&q>0)mo[k]=q}
  return{source:["default","API","manual"].indexOf(m.source)>=0?m.source:"default",updatedAt:sStr(m.updatedAt),rates:r,status:["default","online","offline","error"].indexOf(m.status)>=0?m.status:"default",manualOverride:mo,lastTry:sStr(m.lastTry),api:sStr(m.api)}}
var MIG=[ // 每個函式把 version N 升到 N+1；缺欄位由 normBlock / migrate 補預設
  function v1to2(d){return d},
  function v2to3(d){return d} // V2.1：exchangeRateMeta / dayNotes / photos / trans.ticketStatus / 新分類，皆由正規化補預設
];
function migrate(o){
  if(!o||typeof o!=="object"||Array.isArray(o))throw new Error("資料格式不正確");
  var v=Math.floor(+o.version||1),d=Object.assign(defState(),o);
  if(v>VER)throw new Error("這份資料來自較新的版本（v"+v+"），無法匯入");
  for(var i=v;i<VER;i++){d=MIG[i-1](d)}
  var old=v<2;
  d.rates=normRates(d.rates);
  d.trip=sStr(d.trip,"我的旅行")||"我的旅行";d.budget=Math.max(0,sNum(d.budget,30000));
  d.defPeople=Math.min(99,Math.max(1,Math.floor(sNum(d.defPeople,1))));
  d.ac=(["sakura","maple","sea","classic","PRIVATE_THEME_XIAOMALEI"].indexOf(d.ac)>=0||(typeof THEME_PACKS!=="undefined"&&THEME_PACKS[d.ac]))?d.ac:"sakura";
  d.tid=sStr(d.tid,"t1")||"t1";
  if(d.cover!==undefined)d.cover=sStr(d.cover);
  normBlock(d,old);
  d.exchangeRateMeta=normFx(d.exchangeRateMeta,d.rates);
  d.photos=uniq(arr(d.photos).map(normPhoto).filter(function(p){return p.aid||p.lid}));
  d.trips=arr(d.trips).filter(function(t){return t&&typeof t==="object"}).map(function(t){
    t=Object.assign({},t);t.id=sStr(t.id,"t"+mkId());t.name=sStr(t.name,"舊旅程");t.rates=normRates(t.rates||d.rates);t.cover=sStr(t.cover);
    normBlock(t,old);return t});
  d.version=VER;return d}

/* ===== Storage ===== */
function load(){
  var raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){LOADERR="無法讀取瀏覽器儲存空間，這次的資料只會暫存，請先匯出備份。";return defState()}
  if(!raw)return defState();
  try{
    var o=JSON.parse(raw);
    if((+o.version||1)<VER){try{if(!localStorage.getItem(KEY+"-v1-backup"))localStorage.setItem(KEY+"-v1-backup",raw)}catch(e){}}
    return migrate(o)
  }catch(e){
    try{localStorage.setItem(KEY+"-corrupt-"+Date.now(),raw)}catch(_){}
    LOADERR="先前儲存的資料格式損壞，原始內容已另存為備份（設定 → 本機備份可以還原），目前用空白資料啟動。";
    return defState()}
}
function save(){S.version=VER;try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast("⚠️ 無法儲存（空間不足或被封鎖），請先到設定匯出完整資料備份。");return false}}

/* ===== Money / rate ===== */
function itRate(it){return(it.rate>0)?it.rate:((S.rates[it.cur]>0)?S.rates[it.cur]:(it.cur==="TWD"?1:0))}
function twd(it){return Math.round(it.amount*itRate(it))}            // 總支出（台幣），使用該筆固定匯率
function twdPer(it){return it.amount*itRate(it)/Math.max(1,it.people||1)} // 每人分攤（台幣，不取整）
function per(it){return it.amount/Math.max(1,it.people||1)}              // 每人分攤（原幣）
function sumTwd(list){return list.reduce(function(s,i){return s+twd(i)},0)}
function sumPer(list){return list.reduce(function(s,i){return s+twdPer(i)},0)}
function spentOn(d){return sumTwd(S.items.filter(function(i){return i.date===d}))}
function planCostTwd(p){return Math.round((p.cost||0)*((S.rates[p.costCur]>0)?S.rates[p.costCur]:(p.costCur==="TWD"?1:0)))}

var toastT=null,undoFn=null,finFn=null;
function toastEnd(){var f=finFn;finFn=null;undoFn=null;var el=$("ts");if(el)el.classList.add("hide");if(f){try{f()}catch(e){}}}
function toast(msg,label,act,fin){
  if(finFn){var f0=finFn;finFn=null;try{f0()}catch(e){}}
  var el=$("ts");el.innerHTML='<span>'+esc(msg)+'</span>'+(act?'<button onclick="doUndo()">'+esc(label||"復原")+'</button>':'');
  undoFn=act||null;finFn=fin||null;el.classList.remove("hide");clearTimeout(toastT);toastT=setTimeout(toastEnd,act?7000:3800)}
function doUndo(){var f=undoFn;undoFn=null;finFn=null;clearTimeout(toastT);$("ts").classList.add("hide");if(f){try{f()}catch(e){showErr(e)}}}

/* 刪除：統一確認 + 復原（復原把項目放回原位置） */
var LISTS={item:"items",plan:"plan",gosh:"gosh",trans:"trans",resv:"resv",pack:"pack"};
function askDel(kind,id,msg){confirmBox(msg||"確定要刪除這筆資料嗎？","刪除",function(){doDel(kind,id)})}
function doDel(kind,id){
  var key=LISTS[kind],list=S[key],ix=-1;
  list.forEach(function(x,i){if(x.id===id)ix=i});if(ix<0)return;
  var it=list.splice(ix,1)[0];save();render();
  toast("已刪除","復原",function(){S[key].splice(Math.min(ix,S[key].length),0,it);save();render()})}

function goToday(){

function pdTitle(list){var rg=regionOf(list),real=list.filter(function(p){return p.time!=="23:59"&&!p.skip}),

function pdReduce(){try{return window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}}

function pdAfter(){
  var dir=pdAnim;pdAnim=0;
  var strip=$("pds"),on=strip&&strip.querySelector(".pd-d.on");
  if(strip&&on){var sl=window.__pdSL;if(sl!=null)strip.scrollLeft=sl;

  w.addEventListener("touchstart",function(e){if(e.touches.length!==1){x0=null;return}var t=e.touches[0];x0=t.clientX;y0=t.clientY;dx=0;lock=0;t0=Date.now();pg=w.querySelector(".pd-page")},{passive:true});

    if(!lock){if(Math.abs(mx)<8&&Math.abs(my)<8)return;lock=Math.abs(mx)>Math.abs(my)*1.2?1:2}

    var tg=dx<0?w.getAttribute("data-next"):w.getAttribute("data-prev"),v=Math.abs(dx)/Math.max(1,Date.now()-t0);

/* ===== Map（地點集中；沿用 Google Maps 連結）===== */
function routeLink(places){
  var u=places.slice(0,10);if(u.length<2)return"";
  var q="https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(u[0])+"&destination="+encodeURIComponent(u[u.length-1]);
  if(u.length>2)q+="&waypoints="+u.slice(1,-1).map(encodeURIComponent).join("%7C");return q}
function vMap(){
  var ti=tripInfo(),off=isOnline()?'':'<div class="card warn sub">📵 地圖需要網路，目前無法開啟 Google Maps。其他功能不受影響。</div>';if(!ti.n)return off+'<div class="card sub">行程裡填了「地點」，就會集中顯示在這裡。</div>';
  var out='',cnt=0;
  ti.ds.forEach(function(d){
    var seen={},pl=[],L=S.plan.filter(function(p){return p.date===d&&p.place&&p.time!=="23:59"}).sort(byTime);
    L.forEach(function(p){if(!seen[p.place]){seen[p.place]=1;pl.push(p.place)}});if(!pl.length)return;cnt+=pl.length;
    var rg=regionOf(S.plan.filter(function(p){return p.date===d})),rl=routeLink(pl);
    out+='<div class="card"><div class="daybar" style="background:'+rg.c+';cursor:default"><b>第'+dayNum(d)+'天・'+esc(md(d))+'（週'+wk(d)+'）</b><span>'+esc(rg.n)+'</span></div>'
     +pl.map(function(p,i){return '<div style="padding:5px 0;overflow-wrap:anywhere">'+(i+1)+'. <a target="_blank" rel="noopener" href="'+mapLink(p)+'">📍 '+esc(p)+'</a></div>'}).join("")
     +(rl?'<a class="btn sec sm" style="display:block;text-align:center;text-decoration:none;margin-top:8px;line-height:24px" target="_blank" rel="noopener" href="'+rl+'">🧭 開啟當天路線</a>'+(pl.length>10?'<div class="sub">路線最多帶入前 10 個地點</div>':''):'')+'</div>'});
  return off+(out?'<div class="card sub">共 '+cnt+' 個地點。點地點開 Google 地圖，「開啟當天路線」會依行程順序帶入。</div>'+out:'<div class="card sub">行程裡還沒有填寫地點。</div>')}

    if(lab)lab.textContent="處理中 "+(i+1)+" / "+fl.length+"…";

      var b=await shrink(fl[i]),id=mkId()+i,lid="L"+id,stored=await idbPut(lid,b),p={id:id,aid:"",lid:"",trip:S.tid,t:Date.now()};
      if(stored){p.lid=lid;try{LURL[lid]=URL.createObjectURL(b)}catch(e){}}
      else if(CB){var r0=await CB.as.upload(b,{type:"image/jpeg"});p.aid=r0.id}
      else throw new Error("這個瀏覽器無法儲存照片（未允許本機儲存，Cloud 也未連線）");
      P.push(Object.assign(p,meta));save();ok++;

  {n:"fawazahmed0 currency-api (jsDelivr)",u:"https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/twd.json",parse:function(j){var r=j&&j.twd;if(!r||typeof r!=="object")return null;var o={};for(var k in r)o[k.toUpperCase()]=r[k];return o}}];

function fxRound(x){return x<1?Math.round(x*1e5)/1e5:Math.round(x*1e3)/1e3}
function fxTime(iso){if(!iso)return"尚未更新過";var d=new Date(iso);if(isNaN(d))return"尚未更新過";return d.getFullYear()+"/"+pad2(d.getMonth()+1)+"/"+pad2(d.getDate())+" "+pad2(d.getHours())+":"+pad2(d.getMinutes())}
function fxFetch(api){
  return new Promise(function(res,rej){
    if(typeof fetch!=="function")return rej(new Error("no fetch"));
    var ctl=(typeof AbortController!=="undefined")?new AbortController():null,tm=setTimeout(function(){if(ctl)ctl.abort();rej(new Error("timeout"))},8000);
    fetch(api.u,ctl?{signal:ctl.signal,cache:"no-store"}:{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(j){clearTimeout(tm);var r=api.parse(j);if(!r)throw new Error("bad data");res(r)}).catch(function(e){clearTimeout(tm);rej(e)})})}
/* force=true：使用者按「立即更新」；否則最多每 6 小時一次 */
async function fxUpdate(force){
  var m=fxMeta();if(fxBusy)return false;
  if(!force){
    if(m.updatedAt&&m.status==="online"&&Date.now()-Date.parse(m.updatedAt)<FX_TTL)return false;
    if(m.lastTry&&m.status!=="online"&&Date.now()-Date.parse(m.lastTry)<FX_RETRY)return false}
  if(!isOnline()){m.status="offline";save();fxRefresh();return false}
  fxBusy=true;fxRefresh();m.lastTry=new Date().toISOString();var got=null,src="";
  for(var i=0;i<FX_APIS.length&&!got;i++){try{got=await fxFetch(FX_APIS[i]);src=FX_APIS[i].n}catch(e){got=null}}
  try{
    if(got){
      var n=0;Object.keys(S.rates).forEach(function(c){if(c==="TWD")return;var a=+got[c];if(!(a>0)||!isFinite(a))return;var r=fxRound(1/a);if(!(r>0))return;m.rates[c]=r;if(!m.manualOverride[c]){S.rates[c]=r;n++}});
      m.updatedAt=new Date().toISOString();m.status="online";m.source="API";m.api=src;fxLast="ok";
      if(force)toast("✅ 匯率已更新")}
    else{m.status=isOnline()?"error":"offline";fxLast="fail";if(force)toast("⚠️ 匯率暫時無法更新，已繼續使用上次匯率。")}
    save()}
  catch(e){fxLast="fail"}
  fxBusy=false;fxRefresh();return !!got}
function fxRefresh(){var e=$("fxc");if(e)e.innerHTML=fxInner()}
function fxMode(c){var m=fxMeta();if(m.manualOverride&&m.manualOverride[c])return"manual";if(!isOnline()||m.status==="offline")return"offline";return m.updatedAt?"auto":"default"}
function fxInner(c){
  c=c||"JPY";var m=fxMeta(),r=S.rates[c],mode=fxMode(c),sym=SYM[c]||(c+" ");
  var tag=mode==="manual"?'<span class="tag y">✏️ 手動匯率</span>':mode==="offline"?'<span class="tag">📵 離線模式｜使用上次匯率</span>':mode==="auto"?'<span class="tag g">🟢 自動更新</span>':'<span class="tag">預設匯率（尚未更新）</span>';
  var warn=(m.status==="error"&&mode!=="manual"&&mode!=="offline")?'<div class="warn sub" style="margin-top:4px">⚠️ 匯率暫時無法更新，已繼續使用上次匯率。</div>':'';

/* ===== V3.0 跨日交通：完整日期＋時間 ===== */
function nt(t){t=String(t||"");var m=/^(\d{1,2}):(\d{2})/.exec(t);return m?pad2(+m[1])+":"+m[2]:""}
function tkey(d,t){return(d||"")+" "+(nt(t)||"99:99")}                 // 可直接做字串比較的「日期＋時間」
function tms(d,t){var a=String(d||"").split("-"),b=nt(t).split(":");if(a.length<3||b.length<2)return null;var v=new Date(+a[0],+a[1]-1,+a[2],+b[0],+b[1],0).getTime();return isNaN(v)?null:Math.round(v/60000)}
function transSpan(t){
  var ad=t.arrDate||t.date,cross=!!(t.date&&ad&&ad!==t.date),hasArr=!!t.arrTime||cross,m=null;
  if(t.time&&t.arrTime){var a=tms(t.date,t.time),b=tms(ad,t.arrTime);if(a!=null&&b!=null&&b>=a)m=b-a}
  return{ad:ad,cross:cross,hasArr:hasArr,mins:m,days:cross?dayDiff(t.date,ad):0}}
function durText(m){if(m==null)return"";var h=Math.floor(m/60),mm=m%60;return(h?h+" 小時":"")+((mm||!h)?(h?" ":"")+mm+" 分":"")}
function tIcon(t){return(transLabel(t.type).split(" ")[0])||"🚆"}
/* 簡短一行：23:50 → 03:30（+1 日） */
function transInline(t){var s=transSpan(t),o=nt(t.time)||"";if(!s.hasArr)return o;
  return o+(o?" → ":"抵達 ")+(s.cross?md(s.ad)+" ":"")+(nt(t.arrTime)||"")+(s.cross?"（+"+s.days+" 日）":"")}
/* 卡片用：出發／抵達分行＋時長 */
function transWhen(t){
  var s=transSpan(t);if(!s.hasArr)return t.time?'<div class="sub">'+esc(t.time)+'</div>':'';
  var dp=s.cross?md(t.date)+" ":"",ar=s.cross?md(s.ad)+" ":"";
  return '<div class="sub">'+(t.time?esc(dp+nt(t.time))+' 出發':'')+'</div><div class="sub">'+(t.arrTime?esc(ar+nt(t.arrTime))+' 抵達':esc(ar.trim())+' 抵達')+(s.cross?' <span class="tag y">🌙 跨日'+(s.days>1?' '+s.days+' 日':'')+'</span>':'')+'</div>'
   +(s.mins!=null?'<div class="sub">⏱️ '+esc(durText(s.mins))+'</div>':'')}
/* 某一天的交通事件（出發／跨日途中／跨日抵達） */
function transEvents(d){var ev=[];
  S.trans.forEach(function(t){var s=transSpan(t);
    if(t.date===d)ev.push({k:"dep",t:t,s:s,key:tkey(d,t.time)});
    if(s.cross&&s.ad===d)ev.push({k:"arr",t:t,s:s,key:tkey(d,t.arrTime)});
    if(s.cross&&t.date<d&&d<s.ad)ev.push({k:"mid",t:t,s:s,key:tkey(d,"00:00")})});
  return ev}
function evRow(e){
  var t=e.t,s=e.s,route=esc(t.from||"？")+' → '+esc(t.to||"？"),ic=tIcon(t),h;
  if(e.k==="arr")h='<b style="display:inline">🛬 <span class="sub" style="font-weight:400">'+esc(nt(t.arrTime)||"抵達")+'</span> '+route+'</b> <span class="tag y">🌙 跨日交通抵達</span><div class="sub">'+(t.time?esc(md(t.date)+" "+nt(t.time))+' 出發':'')+(s.mins!=null?'・⏱️ '+esc(durText(s.mins)):'')+'</div>';
  else if(e.k==="mid")h='<b style="display:inline">'+ic+' <span class="sub" style="font-weight:400">途中</span> '+route+'</b> <span class="tag y">🌙 跨日交通，途中</span><div class="sub">預計 '+esc(md(s.ad)+" "+(nt(t.arrTime)||""))+' 抵達</div>';
  else h='<b style="display:inline">'+ic+' <span class="sub" style="font-weight:400">'+esc(nt(t.time)||"")+'</span> '+route+'</b> '+(s.cross?'<span class="tag y">🌙 跨日交通，途中</span>':'')
    +(s.hasArr?'<div class="sub">'+(s.cross?esc(md(s.ad)+" "):'')+esc(nt(t.arrTime)||"")+' 抵達'+(s.mins!=null?'・⏱️ '+esc(durText(s.mins)):'')+'</div>':'');
  return '<div class="item evt" style="cursor:pointer" onclick="editTrans('+t.id+')"><div>'+h+'</div><div class="amt">'+ticketTag(t.ticketStatus)+'</div></div>'}
/* 把行程與交通事件依完整日期＋時間合併排序 */
function mergeRows(d,items,rowFn){
  var rows=items.map(function(p){return{key:tkey(d,p.time==="23:59"?"23:59":p.time),h:rowFn(p)}});
  transEvents(d).forEach(function(e){rows.push({key:e.key,h:evRow(e)})});
  rows.sort(function(a,b){return a.key<b.key?-1:a.key>b.key?1:0});return rows.map(function(r){return r.h}).join("")}
function transExpLine(t,d){var s=transSpan(t),nm=transLabel(t.type).replace(/^\S+\s/,""),base=(t.from||"?")+" → "+(t.to||"?");
  if(d&&s.cross&&s.ad===d&&t.date!==d)return"🛬 "+nm+"　"+base+"　"+(nt(t.arrTime)||"")+" 抵達（"+md(t.date)+" "+(nt(t.time)||"")+" 出發）　["+t.ticketStatus+"]";
  return"🚄 "+nm+"　"+base+(t.time?"　"+nt(t.time):"")+(s.hasArr?" → "+(s.cross?md(s.ad)+" ":"")+(nt(t.arrTime)||"")+(s.mins!=null?"（"+durText(s.mins)+"）":""):"")+(t.no?"　"+t.no:"")+(t.price>0?"　"+money(t.price,t.cur):"")+"　["+t.ticketStatus+"]"}
function tfDep(){var a=$("t_a"),d=$("t_d").value;if(!a||!d)return;if(!a.value||a.value<d||a.getAttribute("data-auto")==="1"){a.value=d;a.setAttribute("data-auto","1")}}
function tfNext(){var d=$("t_d").value||today(),a=$("t_a");a.value=addDays(d,1);a.setAttribute("data-auto","0")}

/* ===== 🐊 小鱷魚旅伴：只負責「提示」，不改任何資料、不是獨立頁面 =====
   圖片 CROC_IMG 來自使用者提供的角色圖（l_croc_img.js）。
   提示位置：首頁最上方（1 則）、行李頁、新增／編輯交通表單（跨日提醒）、完成當天行程的小提示。
   設定 → 小鱷魚提示 可以整個關掉（只存在這台裝置）。 */
var CROC_OFF=false,crocHid=false;
try{CROC_OFF=localStorage.getItem("croc-off")==="1"}catch(e){}
(function(){var st=document.createElement("style");st.textContent=
 '.ctip{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:8px 10px;border-radius:16px;background:#fff4f8;border:1px solid #f4cfdc;color:#3a2530;position:relative}'
 +'.ctip.sm{padding:6px 8px;margin:0 0 10px}'

 +'.ctip .cbub{flex:1;min-width:0;background:#fff;border:1px solid #f4cfdc;border-radius:14px;padding:8px 10px;font-size:14px;line-height:1.45;overflow-wrap:anywhere;position:relative;color:#3a2530}'

 +'.ctip .cbub:after{content:"";position:absolute;left:-5px;top:50%;margin-top:-5px;border:5px solid transparent;border-right-color:#fff;border-left:0}'

 document.head.appendChild(st)})();
function crocOn(){return !CROC_OFF&&!crocHid}
function crocBox(k,msg,sub,cls){
  return '<div class="ctip '+(cls||"")+'"><img class="cimg" alt="" data-k="'+k+'" src="'+(CROC_IMG[k]||"")+'"><div class="cbub"><div>'+esc(msg)+'</div>'+(sub?'<div class="csub">'+esc(sub)+'</div>':'')+'</div>'
   +(cls&&cls.indexOf("nox")>=0?'':'<button class="cx" aria-label="先隱藏小鱷魚提示" onclick="crocHide()">✕</button>')+'</div>'}
function crocHide(){crocHid=true;render()}
function crocToggle(){CROC_OFF=!CROC_OFF;try{localStorage.setItem("croc-off",CROC_OFF?"1":"0")}catch(e){}crocHid=false;render()}
function crocMin(hm){var m=/^(\d{1,2}):(\d{2})$/.exec(hm||"");return m?(+m[1])*60+(+m[2]):null}
function crocNow(){var d=new Date();return pad2(d.getHours())+":"+pad2(d.getMinutes())}
function crocTLabel(t){var f=TRANS_TYPES.filter(function(x){return x[0]===t.type})[0];return f?f[1]:"交通"}
var CROC_OUT=/公園|園|城|神社|寺|散步|老街|海|島|山|橋|街|巡航|市場|點燈|纜車|紅葉|攝影|屋台/,CROC_IN=/美術館|博物館|資料館|咖啡|餐|拉麵|午餐|晚餐|早餐|購物|百貨|溫泉|飯店|Check|行李|機場/;
function crocOutdoor(p){var s=(p.name||"")+" "+(p.place||"");return CROC_OUT.test(s)&&!CROC_IN.test(s)}
/* 首頁：依今天的狀況只挑「最需要」的一則 */
function crocHomeTip(){
  var ti=tripInfo(),t=today();
  if(!ti.n)return crocBox("look","還沒有行程喔，先到「行程」新增第一個地點吧～");
  if(t<ti.first){
    var n=dayDiff(t,ti.first),left=S.pack.filter(function(k){return !k.done}).length;
    if(S.pack.length&&left===0)return crocBox("depart","還有 "+n+" 天就出發囉！行李都備齊了，期待～");
    return crocBox("depart","還有 "+n+" 天就出發囉！行李都準備好了嗎？",left?"行李清單還有 "+left+" 項沒勾":"")}
  if(t>ti.last)return crocBox("rest","旅行結束了，辛苦啦～去看看這趟的回顧吧！");
  var hm=crocNow(),nowM=crocMin(hm),
      its=S.plan.filter(function(p){return p.date===t&&p.time!=="23:59"&&!p.skip}).sort(byTime),
      pend=its.filter(function(p){return !p.done}),
      trs=S.trans.filter(function(x){return x.ticketStatus!=="已取消"});
  /* 1) 跨日交通（今天出發、途中或抵達） */
  var cx=trs.filter(function(x){var sp=transSpan(x);return sp.cross&&x.date<=t&&sp.ad>=t})[0];
  if(cx){var sp=transSpan(cx);return crocBox("train","這趟交通是跨日的，抵達日期記得看清楚喔！",crocTLabel(cx)+" "+(cx.from||"")+" → "+(cx.to||"")+"　"+md(cx.date)+" "+(cx.time||"")+" → "+md(sp.ad)+" "+(cx.arrTime||""))}
  /* 2) 3 小時內要搭的交通 */
  var nt=trs.filter(function(x){var m=crocMin(x.time);return x.date===t&&m!=null&&m>nowM&&m-nowM<=180}).sort(byTime)[0];
  if(nt)return crocBox("train","記得留一點轉乘時間喔！",nt.time+" "+crocTLabel(nt)+"　"+(nt.from||"")+" → "+(nt.to||""));
  /* 3) 都完成了 */
  if(its.length>=2&&!pend.length)return crocBox("sleep","今天的行程都完成囉，辛苦了～早點休息！");
  /* 4) 會下雨 */
  var w=wxGet(t,regionOf(its).n);
  if(w&&w.s==="ok"&&w.pop!=null&&w.pop>=50)return crocBox("umbrella",its.some(crocOutdoor)?"今天有戶外行程，記得帶傘～":"今天可能會下雨，記得帶傘～","降雨機率 "+w.pop+"%");
  /* 5) 今天花得比預算多 */
  var b=budgetInfo();if(b.tb!=null&&b.tb-b.st<0)return crocBox("budget","今天花得有點多，明天輕鬆一點吧～");
  if(!its.length)return crocBox("map","今天沒有排行程，想去哪裡走走嗎？");
  /* 6) 還沒開始 → 出發；否則下一站 */
  if(pend.length===its.length)return crocBox("depart","嘿！今天有行程要出發囉～","今天第一站："+pend[0].name);
  var nx=pend.filter(function(p){var m=crocMin(p.time);return m==null||m>=nowM})[0]||pend[0];
  return crocBox("walk","下一站："+nx.name+"，慢慢來不用趕～")}
var _crocHome=VIEWS.home;

  return h+_crocPack()};

  var el=$("ctipt");if(!el)return;
  var d=$("t_d")&&$("t_d").value,a=$("t_a")&&$("t_a").value,tt=$("t_t")&&$("t_t").value,te=$("t_e")&&$("t_e").value,h="";

  else if(d&&a&&a===d&&tt&&te&&te<tt)h=crocBox("train","抵達時間比出發早，是不是要按「隔天抵達」呢？","","sm nox");
  el.innerHTML=CROC_OFF?"":h}
